# 个人研发效能助手 — 唯一公网入口
# 前端静态文件与 /api、/uploads 同源，因此前端无需再配 CORS。

# HTTP：仅用于 ACME 挑战与跳转 HTTPS
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # certbot 签发后的证书，由 compose 以只读方式挂载
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 整站 Basic Auth：在应用登录之前再加一道门。
    # 对 <img> 同样有效（浏览器在同源下自动附带 Basic 凭证），故 /uploads 无需改造即可不再对公网裸奔。
    # 必须配合 HTTPS：Basic 凭证只是 base64 编码，明文传输等于公开。
    auth_basic           "restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # 带内嵌图的参数表 Excel 可达数十 MB，需与后端 MAX_EXCEL_UPLOAD_BYTES 对齐
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- SSE 必需：缺一个都会让流式输出「看起来坏了」 ---
        # 不关缓冲，增量会被 nginx 攒住，表现为卡很久后一次性全部出现
        proxy_buffering off;
        proxy_cache off;
        # 默认 60s，配置洞察的全量分析很容易超时被掐断连接
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /uploads/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Angular 是 SPA：缺少 try_files 时在 /weekly-report 刷新会 404
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
